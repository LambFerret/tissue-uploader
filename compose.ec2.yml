services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.ec2
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3000"
      DATA_DIR: /app/data
      TRUST_PROXY: "1"
      UPLOAD_CONCURRENCY: "2"
      IMAGE_CONCURRENCY: "1"
      SHARP_CACHE_MB: "32"
    volumes:
      - /srv/tissue-uploader/data:/app/data
    expose:
      - "3000"
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.ec2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
